events {
    worker_connections 1024;
}

http {
    # Correctly map WebSocket upgrade vs normal HTTP connections
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream streamlit_cluster {
        ip_hash;
        server streamlit:8501;
    }

    server {
        listen 80;

        proxy_read_timeout    3600;
        proxy_send_timeout    3600;
        proxy_connect_timeout 60;

        # Default buffering for normal responses
        proxy_buffering          on;
        proxy_buffer_size        128k;
        proxy_buffers            8 256k;
        proxy_busy_buffers_size  512k;

        location / {
            proxy_pass http://streamlit_cluster;

            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Streamlit event stream — must not be buffered or components break
        location /_stcore/stream {
            proxy_pass http://streamlit_cluster;

            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering  off;
            proxy_cache      off;
        }
    }
}
