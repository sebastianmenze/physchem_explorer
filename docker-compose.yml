services:

  streamlit:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data:ro
    environment:
      - DB_PATH=/data/physchem_all.duckdb
    expose:
      - "8501"
    deploy:
      replicas: 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - streamlit
